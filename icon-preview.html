<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumi icon motion check</title>
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui; display: flex; }
  .light-half, .dark-half { flex: 1; padding: 48px; display: flex; flex-direction: column; gap: 32px; align-items: center; }
  .light-half { background: #f8fafc; }
  .dark-half { background: #0b1220; }
  .row { display: flex; gap: 28px; align-items: center; }
  h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin: 0; }
  .dark-half h3 { color: #94a3b8; }

  /* ─── Lumi icon tiles: always-on CSS-3D animated icons (landing page) ──── */
.lumi-icon {
  display: inline-flex;
  flex-shrink: 0;
  perspective: 420px;
  transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1);
}

.lumi-icon:hover {
  transform: scale(1.07);
  z-index: 5;
}

/* The scene floats and sways in real 3D — motion is always on. */
.lumi-icon__scene {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  animation: lumi-float 6s ease-in-out infinite;
}

@keyframes lumi-float {
  0%, 100% { transform: translateY(0) rotateX(10deg) rotateY(-16deg) rotateZ(-3deg); }
  25% { transform: translateY(-5px) rotateX(2deg) rotateY(-4deg) rotateZ(2deg); }
  50% { transform: translateY(-8px) rotateX(-8deg) rotateY(12deg) rotateZ(3deg); }
  75% { transform: translateY(-3px) rotateX(6deg) rotateY(18deg) rotateZ(-2deg); }
}

/* Tilted orbit plane: the dashed path and the satellite circle the tile in
   3D — passing IN FRONT of the disc at the bottom, BEHIND it at the top. */
.lumi-icon__orbit {
  position: absolute;
  inset: -7px;
  transform: rotateX(66deg) rotateZ(-10deg);
  transform-style: preserve-3d;
  pointer-events: none;
}

.lumi-icon__orbit::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed var(--lumi-glow);
  opacity: 0.4;
}

.lumi-icon__orbit-spin {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  animation: lumi-rotate 6.5s linear infinite;
}

@keyframes lumi-rotate {
  from { transform: rotateZ(0deg); }
  to { transform: rotateZ(360deg); }
}

.lumi-icon__sat {
  position: absolute;
  top: calc(var(--lumi-sat) / -2);
  left: 50%;
  width: var(--lumi-sat);
  height: var(--lumi-sat);
  margin-left: calc(var(--lumi-sat) / -2);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, var(--lumi-glow) 65%);
  box-shadow: 0 0 10px 2px var(--lumi-glow);
}

/* The disc sits above the scene plane so the satellite genuinely passes
   behind it. No overflow:hidden here — it would flatten the 3D layers. */
.lumi-icon__disc {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 30%;
  background:
    radial-gradient(120% 120% at 30% 20%, var(--lumi-tint-top) 0%, var(--lumi-tint-bottom) 55%, rgba(255, 255, 255, 0.7) 100%),
    linear-gradient(145deg, #ffffff 0%, rgba(241, 245, 249, 0.95) 100%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.95),
    inset 0 -3px 8px rgba(15, 23, 42, 0.06),
    0 10px 20px -8px var(--lumi-shadow),
    0 3px 6px -2px rgba(15, 23, 42, 0.1);
  transform: translateZ(6px);
  transform-style: preserve-3d;
}

.lumi-icon__glyph {
  display: inline-flex;
  color: var(--lumi-color);
  filter: drop-shadow(0 3px 4px rgba(15, 23, 42, 0.25));
  transform: translateZ(var(--lumi-glyph-z));
  transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
}

/* Hover: freeze the sway, tumble the glyph forward, sweep a light band. */
.lumi-icon:hover .lumi-icon__scene {
  animation-play-state: paused;
}

.lumi-icon:hover .lumi-icon__glyph {
  transform: translateZ(calc(var(--lumi-glyph-z) + 12px)) rotateX(-14deg) rotateY(16deg) scale(1.15);
}

.lumi-icon__gloss {
  position: absolute;
  inset: 0;
  border-radius: 30%;
  overflow: hidden;
  pointer-events: none;
}

.lumi-icon__gloss::before {
  content: '';
  position: absolute;
  inset: -40%;
  background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.7) 50%, transparent 58%);
  transform: translateX(-90%);
}

.lumi-icon:hover .lumi-icon__gloss::before {
  animation: lumi-sweep 0.9s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

@keyframes lumi-sweep {
  from { transform: translateX(-90%); }
  to { transform: translateX(90%); }
}

.dark .lumi-icon__disc {
  background:
    radial-gradient(120% 120% at 30% 20%, var(--lumi-tint-top) 0%, var(--lumi-tint-bottom) 55%, rgba(30, 41, 59, 0.9) 100%),
    linear-gradient(145deg, rgba(51, 65, 85, 0.9) 0%, rgba(30, 41, 59, 0.95) 100%);
  border-color: rgba(148, 163, 184, 0.18);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.08),
    0 10px 22px -8px var(--lumi-shadow);
}

.dark .lumi-icon__glyph {
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45)) brightness(1.25);
}

.dark .lumi-icon__orbit::before {
  opacity: 0.55;
}

.dark .lumi-icon__sat {
  box-shadow: 0 0 14px 3px var(--lumi-glow);
}

@media (prefers-reduced-motion: reduce) {
  .lumi-icon__scene,
  .lumi-icon__orbit-spin,
  .lumi-icon__gloss::before {
    animation: none !important;
  }
  .lumi-icon__scene {
    transform: rotateX(12deg) rotateY(-16deg);
  }
  /* Park the satellite at the front so it stays visible. */
  .lumi-icon__orbit-spin {
    transform: rotateZ(160deg);
  }
  .lumi-icon__glyph {
    transform: translateZ(var(--lumi-glyph-z)) !important;
  }
}

  .s44 { width: 44px; height: 44px; --lumi-sat: 6px; --lumi-glyph-z: 13px; }
  .s56 { width: 56px; height: 56px; --lumi-sat: 8px; --lumi-glyph-z: 16px; }
</style>
</head>
<body>
  <div class="light-half">
    <h3>Light · md (44px)</h3>
    <div class="row" id="row-light-md"></div>
    <h3>Light · lg (56px)</h3>
    <div class="row" id="row-light-lg"></div>
  </div>
  <div class="dark-half">
    <h3>Dark · md (44px)</h3>
    <div class="row dark" id="row-dark-md"></div>
    <h3>Dark · lg (56px)</h3>
    <div class="row dark" id="row-dark-lg"></div>
  </div>

<script>
  const TONES = {
    blue:    { top:'rgba(59,130,246,.18)',  bot:'rgba(147,197,253,.08)', color:'#2563eb', shadow:'rgba(37,99,235,.35)',  glow:'rgba(59,130,246,.55)' },
    emerald: { top:'rgba(16,185,129,.18)',  bot:'rgba(110,231,183,.08)', color:'#059669', shadow:'rgba(5,150,105,.35)',  glow:'rgba(16,185,129,.5)' },
    purple:  { top:'rgba(147,51,234,.16)',  bot:'rgba(216,180,254,.08)', color:'#9333ea', shadow:'rgba(147,51,234,.32)', glow:'rgba(147,51,234,.5)' },
    amber:   { top:'rgba(245,158,11,.18)',  bot:'rgba(253,230,138,.08)', color:'#d97706', shadow:'rgba(217,119,6,.32)',  glow:'rgba(245,158,11,.5)' },
  };
  const GLYPHS = {
    bolt:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    home:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 8.8V21h14V8.8"/></svg>',
    star:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    clock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  };
  function tile(tone, glyph, delay, sizeClass) {
    const t = TONES[tone];
    return `
    <span class="lumi-icon ${sizeClass}" style="
        --lumi-tint-top:${t.top}; --lumi-tint-bottom:${t.bot}; --lumi-color:${t.color};
        --lumi-shadow:${t.shadow}; --lumi-glow:${t.glow};"
      aria-hidden="true">
      <span class="lumi-icon__scene" style="animation-delay:${delay}">
        <span class="lumi-icon__orbit">
          <span class="lumi-icon__orbit-spin" style="animation-delay:${delay}">
            <span class="lumi-icon__sat"></span>
          </span>
        </span>
        <span class="lumi-icon__disc">
          <span class="lumi-icon__glyph">${GLYPHS[glyph]}</span>
          <span class="lumi-icon__gloss"></span>
        </span>
      </span>
    </span>`;
  }
  const set = [
    ['blue','bolt','-0.0s'], ['emerald','home','-1.8s'], ['purple','star','-3.6s'], ['amber','clock','-5.4s'],
  ];
  document.getElementById('row-light-md').innerHTML = set.map(([t,g,d]) => tile(t,g,d,'s44')).join('');
  document.getElementById('row-light-lg').innerHTML = set.map(([t,g,d]) => tile(t,g,d,'s56')).join('');
  document.getElementById('row-dark-md').innerHTML  = set.map(([t,g,d]) => tile(t,g,d,'s44')).join('');
  document.getElementById('row-dark-lg').innerHTML  = set.map(([t,g,d]) => tile(t,g,d,'s56')).join('');
</script>
</body>
</html>
